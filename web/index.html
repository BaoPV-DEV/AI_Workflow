<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>AI Workflow Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --ink:#e7eaf0; --mute:#8b93a7; --acc:#4f8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, 'Segoe UI', sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:grid; grid-template-columns: 250px 1fr 420px; grid-template-rows: 48px 1fr; }
  header { grid-column: 1/-1; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font-size:15px; } header .sp { flex:1; } header small { color:var(--mute); }
  aside, main, section { overflow:auto; border-right:1px solid var(--line); }
  aside { padding:12px; background:var(--panel); }
  main { padding:14px; }
  section { padding:12px; background:var(--panel); display:flex; flex-direction:column; gap:10px; }
  h3 { margin:14px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  button { background:#232838; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); } button.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  input, select, textarea { width:100%; background:#0c0e12; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font:inherit; }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  .proj { padding:7px 9px; border-radius:7px; cursor:pointer; margin-bottom:3px; }
  .proj:hover { background:#1f2430; } .proj.on { background:#25304a; }
  .proj small { color:var(--mute); display:block; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .scene { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:var(--panel); }
  .scene.on { border-color:var(--acc); }
  .scene .hd { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:20px; background:#232838; color:var(--mute); }
  .err { color:var(--err); font-size:12px; white-space:pre-wrap; }
  .ok { color:var(--ok); }
  #frame { width:100%; aspect-ratio:9/16; border:0; border-radius:10px; background:#000; }
  #frame.land { aspect-ratio:16/9; }
  pre#log { background:#0c0e12; border:1px solid var(--line); border-radius:8px; padding:8px; min-height:80px; max-height:220px; overflow:auto; font-size:11.5px; white-space:pre-wrap; margin:0; }
  video { width:100%; border-radius:10px; background:#000; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; width:min(720px, 92vw); }
  .hint { color:var(--mute); font-size:12px; }
</style></head>
<body>
<header>
  <b>🎬 AI Workflow Studio</b><small id="usage"></small><span class="sp"></span>
  <button onclick="dlgNew.showModal()">＋ Video mới</button>
</header>

<aside>
  <h3>Project</h3><div id="projects"></div>
  <h3>Style</h3><div id="styles" class="hint"></div>
</aside>

<main>
  <div id="empty" class="hint">Chọn project bên trái hoặc tạo video mới.</div>
  <div id="editor" hidden>
    <div class="row" style="margin-bottom:10px">
      <b id="pname" style="font-size:16px"></b><span class="sp" style="flex:1"></span>
      <select id="pstyle" style="width:auto"></select>
      <select id="paspect" style="width:auto"><option>9:16</option><option>16:9</option><option>1:1</option></select>
      <button onclick="save()">💾 Lưu</button>
    </div>
    <div id="perr" class="err"></div>
    <div id="scenes"></div>
    <button onclick="addScene()">＋ Thêm cảnh</button>
  </div>
</main>

<section>
  <iframe id="frame"></iframe>
  <div class="row"><button onclick="play()">▶</button><input id="t" type="range" min="0" max="1" step="0.01" value="0" oninput="seek()" style="flex:1"><span id="tl" class="hint">0.0s</span></div>
  <div class="grid2">
    <button onclick="run('voice')">🎙 Giọng đọc</button><button onclick="run('preview')">🖼 Preview</button>
    <button onclick="run('draft')">⚡ Render nháp</button><button class="pri" onclick="run('all')">🎬 Render đầy đủ</button>
  </div>
  <div class="row"><input id="ask" placeholder="Sửa bằng lời, vd: cảnh 3 cho Bo cầm cúp và vui hơn"><button onclick="ask()">🤖</button></div>
  <div class="row"><input id="tr" placeholder="Dịch sang: en,ja" style="flex:1"><button onclick="translate_()">🌐</button></div>
  <pre id="log"></pre>
  <img id="sheet" style="width:100%;border-radius:8px" hidden>
  <video id="vid" controls hidden></video>
</section>

<dialog id="dlgNew">
  <h3>Video mới</h3>
  <textarea id="ntopic" rows="3" placeholder="Chủ đề, vd: Vì sao người Việt thích cà phê sữa đá"></textarea>
  <div class="grid2" style="margin:8px 0">
    <select id="ngenre"><option value="animation">Hoạt hình người que</option><option value="motion_graphic">Motion graphics</option><option value="news">Tin tức</option><option value="explainer">Giải thích</option></select>
    <select id="nstyle"><option value="">Style: tự chọn</option></select>
    <select id="naspect"><option>9:16</option><option>16:9</option></select>
    <input id="nsec" type="number" value="45" title="giây">
  </div>
  <p class="hint">Có API key: bấm <b>Tạo bằng API</b>. Không có: bấm <b>Lấy prompt</b>, dán vào claude.ai, dán JSON trả về vào ô dưới rồi <b>Nhập</b> (0 đồng API).</p>
  <div class="row"><button class="pri" onclick="newApi()">Tạo bằng API</button><button onclick="getPrompt()">Lấy prompt (copy)</button><button onclick="dlgNew.close()">Đóng</button></div>
  <textarea id="nimport" rows="6" placeholder="Dán JSON manifest vào đây" style="margin-top:8px"></textarea>
  <div class="row" style="margin-top:6px"><button onclick="importJson()">Nhập</button><span id="nmsg" class="hint"></span></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const api = async (u, o = {}) => (await fetch(u, { headers: { 'Content-Type': 'application/json' }, ...o, body: o.body ? JSON.stringify(o.body) : undefined })).json();
let META, PID, M, CUR, DUR = 5, playing = false, raf;

async function boot() {
  META = await api('/api/meta');
  for (const [k, v] of Object.entries(META.styles)) {
    $('#pstyle').add(new Option(k, k)); $('#nstyle').add(new Option(k, k));
    $('#styles').insertAdjacentHTML('beforeend', `<div title="${v.label}"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${v.bg};border:1px solid ${v.ink}"></span> ${k}</div>`);
  }
  await loadProjects(); usage();
  const last = localStorage.getItem('vf.pid'); if (last) openProject(last).catch(() => {});
}
async function usage() { const u = await api('/api/usage'); $('#usage').textContent = u.calls ? `· API: ${u.calls} lần, vào ${u.in.toLocaleString()} / ra ${u.out.toLocaleString()} / cache ${u.cache_read.toLocaleString()} token` : '· chưa dùng API'; }
async function loadProjects() {
  const ps = await api('/api/projects');
  $('#projects').innerHTML = ps.map(p => `<div class="proj ${p.id === PID ? 'on' : ''}" onclick="openProject('${p.id}')">${p.id}<small>${p.scenes} cảnh ${p.videos.length ? '· 🎞 ' + p.videos.length : ''}</small></div>`).join('') || '<div class="hint">Chưa có project</div>';
}
async function openProject(id) {
  const r = await api('/api/p/' + id); if (r.error) throw r.error;
  PID = id; M = r.manifest; localStorage.setItem('vf.pid', id);
  $('#empty').hidden = true; $('#editor').hidden = false; $('#pname').textContent = id;
  $('#pstyle').value = M.style || 'classic_light'; $('#paspect').value = M.aspect_ratio || '9:16';
  $('#frame').classList.toggle('land', M.aspect_ratio === '16:9');
  showErr(r.errors); renderScenes(); loadProjects(); showOutputs();
  if (M.scenes.length) pick(0);
}
function showErr(e) { $('#perr').textContent = e && e.length ? '⚠ ' + e.join('\n⚠ ') : ''; }
function sceneHtml(s, i) {
  const tpl = s.visual_type === 'html_animation' ? s.template_name : s.visual_type;
  const extra = Object.fromEntries(Object.entries(s).filter(([k]) => !['scene_id', 'voice_text', 'audio_path', 'duration', 'word_timings', 'speech'].includes(k)));
  return `<div class="scene" id="sc${i}" onclick="pick(${i})">
    <div class="hd"><b>#${s.scene_id}</b><span class="tag">${tpl}</span>${s.duration ? `<span class="tag">${s.duration.toFixed(1)}s</span>` : ''}
      <span style="flex:1"></span><button onclick="event.stopPropagation();move(${i},-1)">↑</button><button onclick="event.stopPropagation();move(${i},1)">↓</button><button onclick="event.stopPropagation();del(${i})">✕</button></div>
    <textarea rows="2" style="font:14px system-ui,sans-serif" onchange="setVoice(${i}, this.value)">${s.voice_text || ''}</textarea>
    <details><summary class="hint">JSON cảnh (template, props, acting)</summary><textarea rows="10" onchange="setJson(${i}, this)">${JSON.stringify(extra, null, 1)}</textarea></details>
  </div>`;
}
function renderScenes() { $('#scenes').innerHTML = M.scenes.map(sceneHtml).join(''); }
function setVoice(i, v) { const s = M.scenes[i]; if (s.voice_text !== v) { s.voice_text = v; delete s.word_timings; delete s.duration; } }
function setJson(i, ta) {
  try { const o = JSON.parse(ta.value), s = M.scenes[i]; for (const k of Object.keys(s)) if (!['scene_id', 'voice_text', 'audio_path', 'duration', 'word_timings', 'speech'].includes(k)) delete s[k]; Object.assign(s, o); ta.style.borderColor = ''; }
  catch (e) { ta.style.borderColor = 'var(--err)'; }
}
function move(i, d) { const j = i + d; if (j < 0 || j >= M.scenes.length) return; [M.scenes[i], M.scenes[j]] = [M.scenes[j], M.scenes[i]]; renderScenes(); }
function del(i) { if (confirm('Xoá cảnh này?')) { M.scenes.splice(i, 1); renderScenes(); } }
function addScene() {
  const id = Math.max(0, ...M.scenes.map(s => +s.scene_id || 0)) + 1;
  M.scenes.push({ scene_id: id, visual_type: 'html_animation', template_name: 'title_card_neon', voice_text: '', props: { heading: 'Tiêu đề' } });
  renderScenes(); pick(M.scenes.length - 1);
}
async function save() {
  M.style = $('#pstyle').value; M.aspect_ratio = $('#paspect').value;
  const r = await api('/api/p/' + PID, { method: 'PUT', body: M }); showErr(r.errors);
  log(r.errors && r.errors.length ? '⚠ Đã lưu, còn lỗi' : '✔ Đã lưu');
  if (CUR !== undefined) pick(CUR);
}
async function pick(i) {
  CUR = i; document.querySelectorAll('.scene').forEach((e, k) => e.classList.toggle('on', k === i));
  await api('/api/p/' + PID, { method: 'PUT', body: M });
  const s = M.scenes[i], r = await api(`/api/p/${PID}/scene/${s.scene_id}`);
  if (r.error) return log('✘ ' + r.error);
  DUR = r.input.duration; $('#t').max = DUR;
  if (!r.template) { $('#frame').srcdoc = `<body style="margin:0;background:#111;color:#999;display:grid;place-items:center;height:100vh;font:14px sans-serif">${r.visual_type}: ${r.src || ''}</body>`; return; }
  const f = $('#frame'); f.removeAttribute('srcdoc');
  f.onload = () => { f.contentWindow.postMessage({ type: 'vf-input', input: r.input }, '*'); seek(); };
  f.src = `/tpl/${r.template}.html?studio=1&v=${Date.now()}`;
}
function seek() { const t = +$('#t').value; $('#tl').textContent = t.toFixed(1) + 's'; $('#frame').contentWindow.postMessage({ type: 'vf-seek', t }, '*'); }
function play() {
  playing = !playing; cancelAnimationFrame(raf); if (!playing) return;
  const t0 = performance.now() - (+$('#t').value) * 1000;
  const tick = () => { if (!playing) return; let t = (performance.now() - t0) / 1000; if (t > DUR) { playing = false; t = DUR; } $('#t').value = t; seek(); raf = requestAnimationFrame(tick); };
  tick();
}
function log(s) { $('#log').textContent = s; }
async function watch(jid, after) {
  const j = await api('/api/jobs/' + jid);
  log(`$ vf ${j.cmd}\n${j.log}`); $('#log').scrollTop = 1e9;
  if (!j.done) return setTimeout(() => watch(jid, after), 700);
  log($('#log').textContent + (j.code === 0 ? '\n✔ xong' : '\n✘ lỗi')); usage(); after && after(j);
}
async function run(step) {
  await save();
  const r = await api(`/api/p/${PID}/run`, { method: 'POST', body: { step } });
  watch(r.job, async () => { const o = await api('/api/p/' + PID); M = o.manifest; renderScenes(); showOutputs(step); loadProjects(); });
}
function showOutputs(step) {
  const ts = Date.now();
  $('#sheet').hidden = step !== 'preview'; $('#sheet').src = `/files/${PID}/preview/_sheet.jpg?${ts}`;
  const v = $('#vid'); const name = step === 'draft' ? `${PID}_draft.mp4` : `${PID}.mp4`;
  fetch(`/files/${PID}/out/${name}`, { method: 'HEAD' }).then(r => { v.hidden = !r.ok; if (r.ok) v.src = `/files/${PID}/out/${name}?${ts}`; });
}
async function ask() { const text = $('#ask').value.trim(); if (!text) return; await save(); const r = await api(`/api/p/${PID}/ask`, { method: 'POST', body: { text } }); watch(r.job, () => openProject(PID)); }
async function translate_() { const to = $('#tr').value.trim(); if (!to) return; const r = await api(`/api/p/${PID}/translate`, { method: 'POST', body: { to } }); watch(r.job, loadProjects); }
const newBody = () => ({ topic: $('#ntopic').value, genre: $('#ngenre').value, style: $('#nstyle').value, aspect: $('#naspect').value, seconds: +$('#nsec').value });
async function newApi() { dlgNew.close(); const r = await api('/api/new', { method: 'POST', body: newBody() }); watch(r.job, async j => { await loadProjects(); const m = j.log.match(/Project: .*[\\/](\S+)/); if (m) openProject(m[1]); }); }
async function getPrompt() { const r = await api('/api/prompt', { method: 'POST', body: newBody() }); await navigator.clipboard.writeText(r.prompt).catch(() => {}); $('#nimport').value = ''; $('#nmsg').textContent = `✔ Đã copy prompt (${r.prompt.length} ký tự ≈ ${Math.round(r.prompt.length / 4)} token). Dán vào claude.ai.`; }
async function importJson() { const r = await api('/api/import', { method: 'POST', body: { text: $('#nimport').value } }); if (r.error) return $('#nmsg').textContent = '✘ ' + r.error; dlgNew.close(); await openProject(r.id); }
boot();
</script>
</body></html>
