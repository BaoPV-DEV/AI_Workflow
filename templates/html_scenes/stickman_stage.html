<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_lib/base.css">
<script type="application/json" data-doc>
{"desc": "Sân khấu người que: nhân vật trong cast diễn theo 'acting' của cảnh (đi, chỉ, cầm đồ, cảm xúc, thoại).",
 "props": {"title": "chữ lớn phía trên (≤6 từ, tuỳ chọn)", "title_at": "lúc hiện title", "backdrop": "plain|studio|room|bedroom|kitchen|office|classroom|library|lab|cafe|shop|hospital|bus|street|city_night|park|nature|forest|beach|mountain|desert|farm|river|temple|castle|space|stage|night",
           "time": "day|sunset|night – thời điểm (bầu trời, đèn, sao)", "weather": "none|rain|snow|leaves|fog",
           "items": "[{emoji|text, x:0-1, y:0-1, size:0-1, at}] đồ vật/biểu tượng hiện ra trên sân khấu"},
 "needs": "acting trong scene; who = tên trong cast"}
</script>
<script type="application/json" data-demo>
{"duration": 6, "props": {"title": "TIẾT KIỆM 90% TOKEN", "backdrop": "office",
  "items": [{"emoji": "💰", "x": 0.82, "y": 0.42, "size": 0.12, "at": 2.5}]},
 "cast": {"Bo": {"head": "filled", "head_fill": "#fff", "shirt": "#ffd23f", "hat": "beanie", "hat_color": "#e63946", "face": true},
          "Mi": {"head": "hollow", "face": true, "scale": 0.85}},
 "acting": [{"who": "Bo", "t": 0, "act": "walk", "move": "enter_left", "mood": "happy"},
            {"who": "Bo", "t": 1.6, "act": "talk", "mood": "happy", "say": "Xem này!"},
            {"who": "Mi", "t": 0.5, "act": "think", "mood": "curious"},
            {"who": "Bo", "t": 3, "act": "present", "hold": "bulb", "mood": "proud"},
            {"who": "Mi", "t": 3.4, "act": "cheer", "mood": "happy"}]}
</script>
<script src="_lib/runtime.js"></script>
<script src="_lib/backdrops.js"></script>
<script src="_lib/stickman.js"></script>
</head><body>
<script>
let svg, sticks = {}, tracks, items = [], titleEl, ground, S, input, bd;

VF.scene({
  setup(inp, root) {
    input = inp;
    const { el } = VF, W = inp.width, H = inp.height, portrait = H > W, p = inp.props || {};
    ground = portrait ? H * 0.69 : H * 0.8;
    S = (portrait ? W * 0.5 : H * 0.46) * (inp.props?.zoom || 1);
    svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'layer' }, root);
    const backG = el('g', {}, svg), itemsG = el('g', {}, svg), figG = el('g', {}, svg), frontG = el('g', {}, svg);
    bd = VF.backdrops.draw(backG, p.backdrop || 'plain', { W, H, gy: ground, style: inp.style || {}, time: p.time || 'day', weather: p.weather || 'none' }, frontG);
    if (bd.dark && !(inp.style || {}).bg?.match(/^#[0-3]/)) figG.setAttribute('style', 'filter: drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 1px #fff)');
    const css = getComputedStyle(document.documentElement);
    const colors = { ink: css.getPropertyValue('--ink').trim(), a1: css.getPropertyValue('--a1').trim(), a2: css.getPropertyValue('--a2').trim(), a3: css.getPropertyValue('--a3').trim() };
    const cast = Object.keys(inp.cast || {}).length ? inp.cast : { hero: {} };
    const names = Object.keys(cast).filter(n => !inp.acting.length || inp.acting.some(b => b.who === n));
    if (!names.length) names.push(Object.keys(cast)[0]);
    sticks = {};
    names.forEach(n => { sticks[n] = new VF.Stick(figG, cast[n], S, colors); });
    VF.lib = { actions: inp.actions || window.__actions || { stand: { frames: [{ pose: {} }] } } };
    tracks = VF.stick.timeline(inp.acting || [], names, W, VF.lib);
    items = (p.items || []).map(it => {
      const g = el('g', { opacity: 0 }, itemsG);
      const fs = (it.size || 0.1) * W;
      el('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': fs, 'font-weight': 800, 'font-family': 'var(--title-font)', fill: 'var(--ink)', text: it.emoji || it.text || '' }, g);
      return { g, x: (it.x ?? 0.5) * W, y: (it.y ?? 0.4) * H, t: VF.at(it.at, 0.3) };
    });
    if (p.title) {
      titleEl = el('div', { class: 'layer center title fs-l' }, root);
      Object.assign(titleEl.style, { bottom: 'auto', height: (portrait ? H * 0.26 : H * 0.24) + 'px', padding: '0 6%', paddingTop: portrait ? H * 0.06 + 'px' : 0 });
      titleEl.innerHTML = p.title.replace(/\*(.+?)\*/g, '<span class="hl">$1</span>');
      titleEl._t = VF.at(p.title_at, 0);
    } else titleEl = null;
  },
  draw(t, inp) {
    const W = inp.width;
    bd && bd.update(t);
    for (const [n, st] of Object.entries(sticks)) {
      const s = VF.stick.stateAt(tracks[n], t, VF.lib, W);
      const w = (inp.words || []).find(x => t >= x.start && t < x.end);
      const talk = s.talking && w ? 0.45 + 0.55 * Math.abs(Math.sin((t - w.start) * 13)) : 0;
      st.pose(s.p, s.x, ground, s.face, { mood: s.mood, hold: s.hold, t, label: s.label, seated: s.seated, talk, idle: s.idle, emote: s.emote, emoteAge: s.emoteAge });
      const since = t - (s.sayT ?? 0);
      st.say(s.say || '', s.say ? VF.clamp(since / 0.15) * VF.clamp((2.6 - since) / 0.3) : 0);
    }
    for (const it of items) {
      const k = VF.prog(t, it.t, 0.45, 'back');
      it.g.setAttribute('opacity', VF.clamp((t - it.t) / 0.2));
      it.g.setAttribute('transform', `translate(${it.x} ${it.y + Math.sin(t * 2.2) * 6}) scale(${0.3 + 0.7 * k})`);
    }
    if (titleEl) {
      const k = VF.prog(t, titleEl._t, 0.5, 'back');
      titleEl.style.opacity = VF.clamp((t - titleEl._t) / 0.25);
      titleEl.style.transform = `translateY(${(1 - k) * -40}px) scale(${0.9 + 0.1 * k})`;
    }
  },
});
</script>
</body></html>
