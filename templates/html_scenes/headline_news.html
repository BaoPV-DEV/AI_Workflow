<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_lib/base.css">
<script type="application/json" data-doc>
{"desc": "Bản tin: nhãn BREAKING, tiêu đề lớn, dòng chữ chạy phía dưới, nguồn tin.",
 "props": {"kicker": "nhãn, mặc định 'TIN NÓNG'", "headline": "tiêu đề ≤10 từ (*từ* để tô)", "ticker": "dòng chữ chạy", "source": "nguồn tin", "image": "ảnh nền trong assets/ (tuỳ chọn)"}}
</script>
<script type="application/json" data-demo>
{"duration": 5, "props": {"headline": "Claude ra mắt *mô hình mới*", "ticker": "Pipeline video AI chạy được trên máy MX250 • Chi phí giảm 90% • ", "source": "AI Workflow"}}
</script>
<script src="_lib/runtime.js"></script>
<style>
  .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.45) saturate(1.2); }
  .panel { position: absolute; left: 6%; right: 6%; top: 30%; }
  .kick { display: inline-block; background: var(--a1); color: #fff; font-weight: 900; padding: .2em .6em; letter-spacing: .12em; }
  .head { margin-top: 4%; color: var(--ink); }
  .head .hl { background: var(--a1); color: #fff; }
  .src { margin-top: 4%; opacity: .7; font-weight: 700; }
  .tick { position: absolute; left: 0; right: 0; bottom: 30%; background: var(--a2); color: #000; font-weight: 800; white-space: nowrap; overflow: hidden; padding: .35em 0; }
  body:not(.portrait) .tick { bottom: 6%; }
  .tick span { display: inline-block; padding-left: 100%; }
</style>
</head><body>
<script>
let kick, head, src, tick, span, img;
VF.scene({
  setup(inp, root) {
    const { el } = VF, p = inp.props;
    if (p.image) { img = el('div', { class: 'bgimg' }, root); img.style.backgroundImage = `url('${inp.assets}${p.image}')`; }
    const pn = el('div', { class: 'panel' }, root);
    kick = el('div', { class: 'kick fs-s', text: p.kicker || 'TIN NÓNG' }, pn);
    head = el('div', { class: 'head title fs-l', html: (p.headline || '').replace(/\*(.+?)\*/g, '<span class="hl">$1</span>') }, pn);
    src = el('div', { class: 'src fs-s', text: p.source ? 'Nguồn: ' + p.source : '' }, pn);
    tick = el('div', { class: 'tick fs-s' }, root);
    span = el('span', { text: (p.ticker || '').repeat(3) }, tick);
  },
  draw(t) {
    kick.style.transform = `scaleX(${VF.prog(t, 0, 0.35, 'back')})`; kick.style.transformOrigin = 'left';
    head.style.opacity = VF.prog(t, 0.25, 0.4); head.style.transform = `translateY(${(1 - VF.prog(t, 0.25, 0.5)) * 40}px)`;
    src.style.opacity = VF.prog(t, 0.8, 0.4) * 0.7;
    tick.style.opacity = VF.prog(t, 0.5, 0.3);
    span.style.transform = `translateX(${-t * 220}px)`;
    if (img) img.style.transform = `scale(${1.05 + t * 0.01})`;
  },
});
</script>
</body></html>
